# ros_gz_bridge configuration for manual drone teleoperation
#
# World: drone_test.world
# Drone model: x500_manual_control, spawned as x500_drone
#
# Usage (pass this file to parameter_bridge via --ros-args -p config_file:=...):
#
#   ros2 run ros_gz_bridge parameter_bridge \
#     --ros-args -p config_file:=$(ros2 pkg prefix --share <your_pkg>)/config/bridges/drone_teleop_bridges.yaml
#
# Or use the absolute path directly during development:
#
#   ros2 run ros_gz_bridge parameter_bridge \
#     --ros-args -p config_file:=/path/to/LOTUSim/config/bridges/drone_teleop_bridges.yaml

# --- Control topics (ROS -> Gazebo) ------------------------------------

# Velocity command sent by teleop nodes (keyboard or joystick)
# Maps the ROS 2 convenience topic /drone/cmd_vel into the Gazebo velocity
# controller's subscription topic.
- ros_topic_name: "/drone/cmd_vel"
  gz_topic_name: "/x500_drone/gazebo/command/twist"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

# Arm / disarm the velocity controller.
# Publish  std_msgs/Bool{data: true}  to enable the controller before flight.
- ros_topic_name: "/drone/enable"
  gz_topic_name: "/x500_drone/enable"
  ros_type_name: "std_msgs/msg/Bool"
  gz_type_name: "gz.msgs.Boolean"
  direction: ROS_TO_GZ

# --- Sensor topics (Gazebo -> ROS) ------------------------------------

- ros_topic_name: "/drone/imu"
  gz_topic_name: "/world/drone_test/model/x500_drone/link/base_link/sensor/imu_sensor/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/drone/air_pressure"
  gz_topic_name: "/world/drone_test/model/x500_drone/link/base_link/sensor/air_pressure_sensor/air_pressure"
  ros_type_name: "sensor_msgs/msg/FluidPressure"
  gz_type_name: "gz.msgs.FluidPressure"
  direction: GZ_TO_ROS

- ros_topic_name: "/drone/magnetometer"
  gz_topic_name: "/world/drone_test/model/x500_drone/link/base_link/sensor/magnetometer_sensor/magnetometer"
  ros_type_name: "sensor_msgs/msg/MagneticField"
  gz_type_name: "gz.msgs.Magnetometer"
  direction: GZ_TO_ROS

- ros_topic_name: "/drone/navsat"
  gz_topic_name: "/world/drone_test/model/x500_drone/link/base_link/sensor/navsat_sensor/navsat"
  ros_type_name: "sensor_msgs/msg/NavSatFix"
  gz_type_name: "gz.msgs.NavSat"
  direction: GZ_TO_ROS
